name: Build and create release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish as a GitHub release
        required: true
        type: string
    
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ env.RELEASE_TAG }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      RELEASE_ASSET: spora-leuven-site.zip
      RELEASE_API_ASSET: spora-leuven-api.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        env:
          PUBLIC_RELEASE_VERSION: ${{ env.RELEASE_TAG }}
        run: npm run build

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish API
        run: dotnet publish api -c Release -o api-publish

      - name: Package build artifacts
        run: |
          (cd dist && zip -r "../${RELEASE_ASSET}" .)
          (cd api-publish && zip -r "../${RELEASE_API_ASSET}" .)

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: spora-leuven-${{ env.RELEASE_TAG }}
          path: |
            ${{ env.RELEASE_ASSET }}
            ${{ env.RELEASE_API_ASSET }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${RELEASE_TAG}" "${RELEASE_ASSET}" "${RELEASE_API_ASSET}" --generate-notes --verify-tag

  deploy:
    needs: release
    uses: ./.github/workflows/deploy_release.yml
    with:
      tag: ${{ needs.release.outputs.release_tag }}
    secrets: inherit
    permissions:
      id-token: write
      contents: read
