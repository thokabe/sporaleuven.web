name: Deploy released App

on:
  release:
    types:
      - published
  workflow_call:
    inputs:
      tag:
        description: Release tag to deploy
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    environment: production
    runs-on: ubuntu-latest
    env:
      # release event has no `inputs`, so fall back to the release tag
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
      RELEASE_ASSET: spora-leuven-site.zip
      RELEASE_API_ASSET: spora-leuven-api.zip
    steps:
      - name: Verify GitHub CLI
        run: gh --version

      - name: Download release artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --pattern "${RELEASE_ASSET}" --pattern "${RELEASE_API_ASSET}"

      - name: Extract release artifacts
        run: |
          mkdir -p site api
          unzip -o "${RELEASE_ASSET}" -d site
          unzip -o "${RELEASE_API_ASSET}" -d api

      - name: Login to Azure
        uses: azure/login@v2
        with:
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}

      - name: Deploy to Azure Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "upload"
          # environment: ${{ env.ENVIRONMENT }}
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "site" # App source code path
          api_location: "api" # Prebuilt API output
          output_location: "" # Built app content directory - optional
          skip_app_build: true
          skip_api_build: true
          ###### End of Repository/Build Configurations ######
